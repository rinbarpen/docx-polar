semantic_format_rules:
- role: paper_title
  match:
    type: front_index
    index: 0
  paragraph:
    alignment: center
    spacing_before: 5pt
    spacing_after: 5pt
  run:
    font: Times New Roman
    fontSize: 48
    fontSizeCs: 48
    bold: true
- role: author_name
  match:
    type: front_index
    index: 1
  paragraph:
    alignment: center
    spacing_before: 5pt
    spacing_after: 2pt
  run:
    fontSize: 18
    fontSizeCs: 18
- role: author_affiliation
  match:
    type: front_index
    index: 2
  paragraph:
    alignment: center
  run:
    fontSize: 16
    fontSizeCs: 16
    italic: true
- role: author_email
  match:
    type: front_index
    index: 3
  paragraph:
    alignment: center
  run:
    fontSize: 16
    fontSizeCs: 16
- role: author_name
  match:
    type: front_index
    index: 4
  paragraph:
    alignment: center
    spacing_before: 5pt
    spacing_after: 2pt
  run:
    fontSize: 18
    fontSizeCs: 18
- role: author_affiliation
  match:
    type: front_index
    index: 5
  paragraph:
    alignment: center
  run:
    fontSize: 16
    fontSizeCs: 16
    italic: true
- role: author_email
  match:
    type: front_index
    index: 6
  paragraph:
    alignment: center
  run:
    fontSize: 16
    fontSizeCs: 16
- role: abstract
  match:
    type: regex
    pattern: "^Abstract[\\s—–-]"
  paragraph:
    alignment: both
  run:
    fontSize: 18
    fontSizeCs: 18
    italic: true
  prefixes:
  - text: "Abstract—"
    run:
      fontSize: 18
      fontSizeCs: 18
      bold: true
  - text: "Abstract–"
    run:
      fontSize: 18
      fontSizeCs: 18
      bold: true
  - text: "Abstract:"
    run:
      fontSize: 18
      fontSizeCs: 18
      bold: true
- role: keywords
  match:
    type: regex
    pattern: "^Keywords[\\s—–-]"
  paragraph:
    alignment: both
  run:
    fontSize: 18
    fontSizeCs: 18
    italic: true
  prefixes:
  - text: "Keywords—"
    run:
      fontSize: 18
      fontSizeCs: 18
      bold: true
  - text: "Keywords–"
    run:
      fontSize: 18
      fontSizeCs: 18
      bold: true
  - text: "Keywords:"
    run:
      fontSize: 18
      fontSizeCs: 18
      bold: true
- role: section_heading
  match:
    type: regex
    pattern: "^(I|II|III|IV|V|VI|VII|VIII|IX|X|XI|XII|XIII|XIV|XV)\\.\\s"
  paragraph:
    alignment: left
    spacing_before: 8pt
    spacing_after: 4pt
    keepNext: true
  run:
    italic: true
    smallCaps: true
    fontSize: 24
    fontSizeCs: 24
- role: subsection_heading
  match:
    type: regex
    pattern: "^[A-Z]\\.\\s+[A-Z]"
  paragraph:
    alignment: left
    spacing_before: 6pt
    spacing_after: 3pt
    keepNext: true
  run:
    italic: true
    fontSize: 21
    fontSizeCs: 21
- role: acknowledgement_heading
  match:
    type: regex
    pattern: "^ACKNOWLEDGMENT"
  paragraph:
    alignment: left
    spacing_before: 8pt
    spacing_after: 4pt
  run:
    italic: true
    smallCaps: true
    fontSize: 21
    fontSizeCs: 21
  sets_context:
    after_acknowledgments: true
- role: references_heading
  match:
    type: regex
    pattern: "^REFERENCES"
  paragraph:
    alignment: left
    spacing_before: 8pt
    spacing_after: 4pt
  run:
    italic: true
    smallCaps: true
    fontSize: 21
    fontSizeCs: 21
  sets_context:
    after_references: true
- role: reference_entry
  match:
    type: after_references
  paragraph:
    alignment: both
    spacing_after: 2.50pt
    spacing_line: 9pt
    spacing_lineRule: exact
    indent_hanging: 17.70pt
  run:
    fontSize: 16
    fontSizeCs: 16
    italic: true
- role: body
  match:
    type: default
  paragraph:
    alignment: both
    indent_firstLine: 14.40pt
    spacing_after: 6pt
    spacing_line: 11.40pt
    spacing_lineRule: auto
  run:
    font: Times New Roman
    fontSize: 21
    fontSizeCs: 21
